name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Package Universal (macOS Intel + Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version || true

      - name: Environment Information
        run: |
          swift --version
          uname -m

      - name: Run Unit Tests
        run: swift test --parallel

      - name: Build Universal Release Bundle (arm64 + x86_64)
        run: ./build_app.sh --release-only --require-universal

      - name: Verify Universal Binary Architectures
        run: |
          lipo -info dist/staging/Mooziac.app/Contents/MacOS/Mooziac
          lipo -verify_arch arm64 x86_64 dist/staging/Mooziac.app/Contents/MacOS/Mooziac

      - name: Upload macOS Universal Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mooziac-macOS-Universal
          path: |
            dist/Mooziac.dmg
            dist/Mooziac.zip
          if-no-files-found: error
